<!DOCTYPE html>
<html>
<head>
    <title>Meow csos</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .info {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <iframe src="https://emeraldgreenr.github.io/" title="Doki Doki Literature Club"></iframe>

    <div class="info">
        Doki Doki Literature Club! is a trademark and intellectual property of Team Salvato.
        CSOS is an unofficial version and is not affiliated with or endorsed by Team Salvato.
    </div>
</body>
</html>
